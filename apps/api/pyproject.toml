[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.141.1",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.1.4",
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-calamine>=0.8.2",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
