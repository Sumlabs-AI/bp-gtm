    verified: true
    verified_on: 2026-09-26
    notes: >-
      Year directory returned HTTP 200. Direct REAL ZIP
      https://dentoncad.net/data/_uploaded/files/datafiles/2026/CertifiedDataReal/2026%20CERTIFIED%20DATA%20-%20REAL.zip
      returned HEAD 200 (819,361,794 bytes); a 64 KB tail range returned 206
      and showed APPRAISAL_INFO, APPRAISAL_IMPROVEMENT_INFO,
      APPRAISAL_IMPROVEMENT_DETAIL, and APPRAISAL_LAND_DETAIL TXT tables.
      Layout
      https://dentoncad.net/data/_uploaded/files/datafiles/2026/AppraisalExportLayout/TP_Legacy8.0.32-AppraisalExportLayout(UPDATED-2:17:26).xlsx
      returned GET 200 (about 104 KB). APPRAISAL_INFO holds owner, mailing,
      situs, homestead flag, improvement state class, and market value;
      APPRAISAL_IMPROVEMENT_DETAIL holds year built and improvement area.
      Multiple owners may occur. Validate which improvement area represents
      living area before scoring.
