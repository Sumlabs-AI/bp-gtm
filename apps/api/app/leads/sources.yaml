      FBCAD labels releases redacted; its GIS-data page disclaims warranties
      and says confidential owner information cannot be disclosed. Respect
      Texas Tax Code 25.025 restrictions.
    verified: true
    verified_on: 2026-09-26
    notes: >-
      Page returned HTTP 200. Direct 2026 property ZIP
      https://www.fbcad.org/wp-content/uploads/2026/07/PropertyData-Post2026Cert-Redacted.zip
      returned HEAD 200 (about 163 MB); residential segments ZIP
      https://www.fbcad.org/wp-content/uploads/2026/07/WebsiteResidentialSegs.zip
      returned HEAD 200 (about 73 MB); and certified Orion ZIP
      https://www.fbcad.org/wp-content/uploads/2026/08/2026_07_07_1746-Orion-2026-Certified-Export-Redacted.zip
      returned HEAD 200 (about 59 MB). Small ranged checks of ZIP directory
      and headers identified Property, Owner, Land, Improvement, Segment, and
      Sales TXT. Property holds market value and situs; Owner holds owner,
      mailing address, and ExemptionList; Land holds StateCode; Segment holds
      ActYrBuilt, Area, and Class. ExemptionList needs code interpretation to
      identify homestead. Files are expressly redacted.
    refresh_strategy: >-
      Weekly compare report-page links and dates embedded in ZIP names, then
      HEAD changed ZIPs; process new supplements with account-level overlap.

