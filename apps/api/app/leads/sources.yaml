  - id: ercot_tdsp_esiid_extract
    name: ERCOT MIS TDSP ESI ID Extract (EMIL ZP15-612; report type 203)
    category: service_points
    geography: ERCOT Texas TDSP territories, including CenterPoint and Oncor
    url: https://www.ercot.com/misapp/servlets/IceDocListJsonWS?reportTypeId=203
    access: bulk_download
    auth_required: false
    format: ZIP of headerless comma-delimited CSV; separate published text layout
    update_cadence: Daily changes; monthly full on first Tuesday after first Monday
    key_fields:
      - ESIID
      - ADDRESS
      - ADDRESS_OVERFLOW
      - CITY
      - STATE
      - ZIPCODE
      - COUNTY
      - DUNS
      - STATUS
      - PREMISE_TYPE
      - METERED
      - SETTLEMENT_AMS_INDICATOR
      - TDSP_AMS_INDICATOR
      - METERED_SERVICE_TYPE
      - METERED_SERVICE_TYPE_DESC
    license_or_terms: >-
      ERCOT public-information terms at https://www.ercot.com/help/terms
      allow public data in compilations and analyses subject to the stated
      conditions; data are provided as-is and access must not impair ERCOT
      systems.
    verified: true
    verified_on: 2026-09-26
    notes: >-
      The report listing returned HTTP 200 with PublishDate, DocID,
      FriendlyName, ContentSize, and ExpiredDate. Product page:
      https://www.ercot.com/mp/data-products/data-product-details?id=ZP15-612.
      File URL pattern:
      https://www.ercot.com/misdownload/servlets/mirDownload?doclookupId={DocID};
      HEAD returned HTTP 200 for a CenterPoint daily file (DocID 1278757464)
      and CenterPoint/Oncor monthly files (1271779092/1271778934). A small
      CenterPoint daily ZIP confirmed headerless CSV. The full monthly ZIPs
      were about 152 MB and 232 MB by HEAD and were not downloaded. Layout:
      https://www.ercot.com/files/docs/2024/05/14/TDSP-ESIID-Extract_20240422.txt.
      PREMISE_TYPE distinguishes Residential from Small/Large Non-Residential,
      not detached homes from apartments. There is no meter-type column;
      METERED and AMS indicators are available. The public legacy MIS listing
      does not require authentication; ERCOT's separate api.ercot.com API
      requires account registration and tokens.
