# URL verification reflects HTTP checks on 2026-09-26. A verified landing page
# does not imply that every linked download or query is usable; see each note.
sources:
  - id: hcad_harris_cama_2026
    name: Harris Central Appraisal District public CAMA exports
    category: property
    geography: Harris County, Texas
    url: https://hcad.org/hcad-online-services/pdata/
    access: bulk_download
    auth_required: false
    format: ZIP archives of headered tab-delimited ASCII TXT files
    update_cadence: Preliminary files weekly May-August; certified set around mid-August
    key_fields:
      - acct
      - owner_name
      - mail_addr
      - site_addr
      - state_class
      - tot_mkt_val
      - use_cd
      - exempt_cat
      - im_sq_ft
      - heat_ar
      - date_erected
    license_or_terms: >-
      Public appraisal data are subject to Texas Tax Code 25.025 restrictions
      for qualifying protected owners. HCAD's codebook and download page do
      not grant a separate explicit reuse license.
    verified: true
    verified_on: 2026-09-26
    notes: >-
      Page returned HTTP 200. Direct ZIP pattern is
      https://download.hcad.org/data/CAMA/2026/{Real_acct_owner,Real_building_land,Real_jur_exempt}.zip;
      each 2026 ZIP returned HEAD 200 (about 212, 235, and 114 MB; all
      Last-Modified 2026-09-20). Codebook
      https://hcad.org/assets/uploads/pdf/pdataCodebook.pdf returned HEAD
      200. In Real_acct_owner, real_acct.txt holds owner, mailing and situs
      address, state class, and total market value. In Real_building_land,
      land.txt has use_cd and building_res.txt has improvement area/heat_ar
      and date_erected. In Real_jur_exempt, jur_exempt_cd.txt supplies exemption
      categories; join by account to derive homestead status. Do not equate
      generic bld_ar with conditioned living area without codebook checks.
    refresh_strategy: >-
      Weekly HEAD all three same-year ZIPs and compare Last-Modified, ETag,
      and Content-Length; check page for a newly certified or next-tax-year set.

