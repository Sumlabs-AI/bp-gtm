  - id: txgio_stratmap_land_parcels
    name: TxGIO StratMap Land Parcels
    category: parcels
    geography: Texas statewide; Harris, Fort Bend, Collin, Denton, Dallas, Tarrant, Travis, Williamson
    url: https://data.geographic.texas.gov/?s=land%20parcels&pg=1
    access: portal_only
    auth_required: false
    format: ZIP of shapefile or file geodatabase, plus metadata and conversion file
    update_cadence: TxGIO aims for annual acquisition by county; some counties refresh more often
    key_fields:
      - prop_id
      - geo_id
      - owner_name
      - situs_addr
      - mail_addr
      - mkt_value
      - year_built
      - stat_land_use
      - loc_land_use
      - fips
      - county
      - tax_year
      - date_acq
    license_or_terms: >-
      TxGIO says county packages are distributed at no cost, are not survey grade,
      and must not be used for legal purposes; the ArcGIS layer credits TxGIO,
      counties, and vendors. No explicit reuse license was found. Do not infer
      that protected owner identities are present; Tax Code 25.025 can restrict
      disclosure of eligible owners' home-address information.
    verified: false
    verified_on: 2026-09-26
    notes: >-
      The official information page
      https://geographic.texas.gov/stratmap/land-parcels.html returned HTTP
      200; its linked DataHub download URL above returned HTTP 403 to curl,
      so county package URLs and current YYYYMM vintages for
      these eight counties were not confirmed. TxGIO documents shapefile and
      geodatabase delivery and says the county year/month is in each file name
      as YYYYMM; its files are compiled as-is from appraisal districts, may
      have null attributes, and not every county is available. Map service
      https://feature.geographic.texas.gov/arcgis/rest/services/Parcels/stratmap_land_parcels_48_most_recent/MapServer/0?f=pjson
      returned HTTP 200 and exposed the listed fields, but its query operation
      returned an ArcGIS HTTP-200 error code 400 (unsupported). This layer has
      no homestead exemption or living-area field and is not a substitute for
      county CAMA exports.
    refresh_strategy: >-
      Check the DataHub county package list weekly for a new YYYYMM file name;
      retain the per-county date_acq and tax_year, and compare package metadata.
      A change to the landing page alone is not evidence of refreshed parcels.

  - id: puct_iou_ccn_territories
    name: PUCT electric investor-owned utility CCN polygons
    category: territory
    geography: Texas statewide; includes CenterPoint and Oncor service areas
    url: https://services6.arcgis.com/N6Lzvtb46cpxThhu/ArcGIS/rest/services/IOU/FeatureServer/300?f=json
    access: restricted
    auth_required: false
    format: ArcGIS FeatureServer polygon features (JSON)
    update_cadence: Irregular; layer edit timestamp was 2026-06-29
    key_fields:
      - COMPANY_NAME
      - COMPANY_ABBREVIATION
      - COMPANY_TYPE
      - CCN_NO
      - DATA_SOURCE
      - DATA_SOURCE_DATE
      - COMPANY_ELECTRIC_OUTAGES_MAPLINK
      - geometry
    license_or_terms: >-
      ArcGIS layer ISO metadata states: "Use is limited to the individuals
      identified in a Master Service Agreement with Platts." Public query
      access does not authorize commercial lead scoring. PUCT also labels
      these GIS boundaries unofficial approximations; signed county mylar
      maps and docket amendments govern official CCN boundaries.
    verified: true
    verified_on: 2026-09-26
    notes: >-
      Layer metadata and a small query returned HTTP 200. CenterPoint Energy
      Houston Electric LLC has CCN 30086 with source date 2023-03-14; Oncor
      Electric Delivery Company LLC has CCNs 30026 and 30198 with source date
      2023-03-07. The 2026 layer edit timestamp does not make each individual
      boundary current to 2026. Use a point-in-polygon match as an initial
      territory screen only if usage rights are secured, then verify ambiguous
      addresses against the TDSP ESI ID extract or official CCN record. Terms:
      https://services6.arcgis.com/N6Lzvtb46cpxThhu/arcgis/rest/services/IOU/FeatureServer/300/metadata?f=html&format=default.
    refresh_strategy: >-
      After securing Platts usage rights, compare editingInfo.dataLastEditDate
      and feature count weekly; on change, compare CCN_NO, DATA_SOURCE_DATE,
      and geometry.

