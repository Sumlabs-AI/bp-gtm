    verified_on: 2026-09-26
    notes: >-
      CCAD portal page https://collincad.org/open-data-portal/ returned HTTP
      200 and points to Texas Open Data. The certified 2026 Socrata URL and
      metadata https://data.texas.gov/api/views/5tkr-3759.json returned JSON
